<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#1a3832" />
      <stop offset="100%" stop-color="#0b1715" />
    </radialGradient>
    <linearGradient id="brass" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#edd4a7" />
      <stop offset="50%" stop-color="#c9ab81" />
      <stop offset="100%" stop-color="#9c7c57" />
    </linearGradient>
    <linearGradient id="domeGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e5ca9c" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c9ab81" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Médaillon vert bouteille profond (esprit couverture de carte) -->
  <rect x="1" y="1" width="62" height="62" rx="12" fill="url(#bg)" />

  <!-- Cartouche Art Déco à écoinçons rentrants (inspiré de la carte imprimée) -->
  <path
    d="M 13.5 5 H 50.5 V 9.5 H 54.5 V 13.5 H 59 V 50.5 H 54.5 V 54.5 H 50.5 V 59 H 13.5 V 54.5 H 9.5 V 50.5 H 5 V 13.5 H 9.5 V 9.5 H 13.5 Z"
    fill="none"
    stroke="#b89668"
    stroke-width="1.35"
    stroke-linejoin="miter"
    opacity="0.88"
  />
  <!-- Petits cabochons d'angle laiton -->
  <rect x="5" y="5" width="2.4" height="2.4" fill="#c9ab81" opacity="0.8" />
  <rect x="56.6" y="5" width="2.4" height="2.4" fill="#c9ab81" opacity="0.8" />
  <rect x="5" y="56.6" width="2.4" height="2.4" fill="#c9ab81" opacity="0.8" />
  <rect x="56.6" y="56.6" width="2.4" height="2.4" fill="#c9ab81" opacity="0.8" />

  <!-- Nervures chevrons Art Déco sous le contour du dôme -->
  <path
    d="M 26.3 24.4 L 39.5 42 M 33.8 23.6 L 47.4 41.7 M 27.7 26.3 L 15.9 42 M 33.1 33.5 L 26.7 42"
    fill="none"
    stroke="#b89668"
    stroke-width="1.5"
    stroke-linecap="butt"
    opacity="0.85"
  />

  <!-- Dôme de la cloche de brasserie (posé par-dessus pour des jonctions nettes) -->
  <path
    d="M 13.5 42 A 18.5 18.5 0 0 1 50.5 42 Z"
    fill="url(#domeGlow)"
    stroke="url(#brass)"
    stroke-width="2.7"
    stroke-linejoin="round"
  />

  <!-- Bouton / prise de cloche en laiton tourné -->
  <line x1="32" y1="20.2" x2="32" y2="23.5" stroke="url(#brass)" stroke-width="2.6" />
  <circle cx="32" cy="17.2" r="2.9" fill="#132824" stroke="url(#brass)" stroke-width="2.3" />

  <!-- Plateau de service de brasserie à rebords relevés -->
  <path
    d="M 9.5 45.8 L 12.4 47.4 H 51.6 L 54.5 45.8"
    fill="none"
    stroke="url(#brass)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
