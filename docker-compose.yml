# Stack locale : fichiers dans ./wordpress (miroir OVH), base MariaDB.
# 1. cp .env.example .env && éditer les mots de passe
# 2. Exporter la BDD OVH (voir EXPORT-ET-IMPORT-BDD.txt), placer le dump dans import/
# 3. docker compose up -d
# 4. Dans wp-config.php : DB_HOST='db' (sans port), DB_USER/DB_PASSWORD/DB_NAME = valeurs .env

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./import:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./wordpress:/var/www/html

volumes:
  db_data:
